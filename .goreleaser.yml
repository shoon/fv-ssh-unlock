version: 2
project_name: fv-ssh-unlock

before:
  hooks:
    - go mod tidy -diff
    # Package a copy of the systemd unit with ExecStart pointed at the
    # nfpm-installed /usr/bin path (see nfpms[].bindir below). The tracked
    # deploy/systemd/fv-ssh-unlock.service keeps ExecStart=/usr/local/bin/...
    # for source/archive installs; this generated copy is package-only and is
    # never committed.
    - sh -c "mkdir -p .packaging/systemd && sed 's#/usr/local/bin/fv-ssh-unlock#/usr/bin/fv-ssh-unlock#' deploy/systemd/fv-ssh-unlock.service > .packaging/systemd/fv-ssh-unlock.service"

builds:
  - id: fv-ssh-unlock
    main: ./cmd/fv-ssh-unlock
    binary: fv-ssh-unlock
    env:
      - CGO_ENABLED=0
      # Release builds must resolve dependencies the same way the Docker
      # build does (plain module mode from go.mod/go.sum), not workspace
      # mode from the repo-root go.work, so the two build paths cannot
      # silently diverge on resolved versions.
      - GOWORK=off
    flags:
      - -tags=keyring
      - -trimpath
    ldflags:
      - -s -w -buildid= -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - fv-ssh-unlock
    name_template: "fv-ssh-unlock_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.txt
      - TRADEMARKS.md
      - SECURITY.md
      - CONTRIBUTING.md
      - README.md
      - CHANGELOG.md
      - docs/*.md
      - deploy/**/*
      - contrib/ansible/**/*
      - hack/verify-container-image.sh
      - tools/mock-fv-ssh-server/README.md
      - tools/mock-fv-ssh-server/Tahoe 26.0 FileVault SSH Real Output.txt
      - assets/fv-ssh-unlock.png

nfpms:
  - id: linux-packages
    ids:
      - fv-ssh-unlock
    package_name: fv-ssh-unlock
    vendor: fv-ssh-unlock contributors
    homepage: https://github.com/shoon/fv-ssh-unlock
    maintainer: Shaun Murphy <shaun-github@ncdents.com>
    description: Securely monitor and unlock FileVault-protected Macs over SSH
    license: Apache-2.0
    section: utils
    priority: optional
    bindir: /usr/bin
    formats:
      - deb
      - rpm
    contents:
      - src: LICENSE
        dst: /usr/share/doc/fv-ssh-unlock/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/fv-ssh-unlock/NOTICE
      - src: THIRD_PARTY_NOTICES.txt
        dst: /usr/share/doc/fv-ssh-unlock/THIRD_PARTY_NOTICES.txt
      - src: TRADEMARKS.md
        dst: /usr/share/doc/fv-ssh-unlock/TRADEMARKS.md
      - src: .packaging/systemd/fv-ssh-unlock.service
        dst: /usr/lib/systemd/system/fv-ssh-unlock.service
        # A vendor unit under /usr/lib is package-owned and must be replaced on
        # upgrade, so this is a plain file rather than config|noreplace. Local
        # changes belong in /etc/systemd/system as a drop-in override.
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"

sboms:
  - id: archive-sboms
    artifacts: archive
  - id: package-sboms
    artifacts: package

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

release:
  draft: false
  prerelease: auto
