version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /tools/mock-fv-ssh-server
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/New_York
    labels: [dependencies]
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      golang-x:
        patterns: ['golang.org/x/*']
      go-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:15'
      timezone: America/New_York
    labels: [dependencies]
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:20'
      timezone: America/New_York
    labels: [dependencies]
    open-pull-requests-limit: 5
    rebase-strategy: auto
