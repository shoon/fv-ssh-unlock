name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: "off"

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            tools/mock-fv-ssh-server/go.sum
      - name: Bind the release to the pushed tag and main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_REF: refs/tags/${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" != "$EXPECTED_REF" ]]; then
            echo "release tag/ref mismatch: tag=$RELEASE_TAG ref=$GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "release tag is not a supported semantic version: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" || \
                "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "release tag, checkout, and GitHub event do not resolve to one commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tag does not point to a commit on origin/main" >&2
            exit 1
          fi
      - name: Verify, build, vet, and test
        run: |
          go mod verify
          (cd tools/mock-fv-ssh-server && go mod verify)
          go mod tidy -diff
          (cd tools/mock-fv-ssh-server && go mod tidy -diff)
          go build ./...
          go build -tags keyring ./...
          go vet ./...
          go vet -tags keyring ./...
          go test -race ./...
          (cd tools/mock-fv-ssh-server && go build ./... && go vet ./... && go test -race ./...)
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
          govulncheck -tags keyring ./...
          (cd tools/mock-fv-ssh-server && govulncheck ./...)
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.0
          install-only: true
      - name: Validate release configuration
        run: goreleaser check

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            tools/mock-fv-ssh-server/go.sum
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.0
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.0
          install-only: true
      - name: Build and publish signed release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean
