name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build and test in plain module mode, the way the Docker build and the
# release build resolve dependencies. The repo-root go.work is a local
# development convenience; letting CI run in workspace mode would allow the
# two dependency sets to diverge without anything failing.
env:
  GOWORK: "off"

jobs:
  build-test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            tools/mock-fv-ssh-server/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Verify mock module
        working-directory: tools/mock-fv-ssh-server
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -cover ./...
      - name: Mock server build, vet, and test
        working-directory: tools/mock-fv-ssh-server
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

  coverage:
    name: Coverage regression gate
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      MAIN_COVERAGE_FLOOR: "70"
      MOCK_COVERAGE_FLOOR: "70"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            tools/mock-fv-ssh-server/go.sum
      - name: Measure and enforce aggregate statement coverage
        shell: bash
        run: |
          main_profile="${RUNNER_TEMP}/fv-ssh-unlock-main.cover"
          mock_profile="${RUNNER_TEMP}/fv-ssh-unlock-mock.cover"

          go test -count=1 -covermode=atomic -coverprofile="$main_profile" ./...
          (
            cd tools/mock-fv-ssh-server
            go test -count=1 -covermode=atomic -coverprofile="$mock_profile" ./...
          )

          main_report="$(go tool cover -func="$main_profile")"
          mock_report="$(cd tools/mock-fv-ssh-server && go tool cover -func="$mock_profile")"
          printf '%s\n' "$main_report"
          printf '%s\n' "$mock_report"

          main_total="$(printf '%s\n' "$main_report" | awk '$1 == "total:" { value=$3; sub(/%$/, "", value); print value }')"
          mock_total="$(printf '%s\n' "$mock_report" | awk '$1 == "total:" { value=$3; sub(/%$/, "", value); print value }')"
          if [[ ! "$main_total" =~ ^[0-9]+([.][0-9]+)?$ || ! "$mock_total" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "could not parse aggregate coverage totals" >&2
            exit 1
          fi

          {
            echo "### Go statement coverage"
            echo
            echo "| Module | Actual | Required |"
            echo "| --- | ---: | ---: |"
            echo "| Main | ${main_total}% | ${MAIN_COVERAGE_FLOOR}% |"
            echo "| Mock SSH server | ${mock_total}% | ${MOCK_COVERAGE_FLOOR}% |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          if ! awk -v actual="$main_total" -v floor="$MAIN_COVERAGE_FLOOR" \
            'BEGIN { exit !(actual + 0 >= floor + 0) }'; then
            echo "main module coverage ${main_total}% is below ${MAIN_COVERAGE_FLOOR}%" >&2
            failed=1
          fi
          if ! awk -v actual="$mock_total" -v floor="$MOCK_COVERAGE_FLOOR" \
            'BEGIN { exit !(actual + 0 >= floor + 0) }'; then
            echo "mock module coverage ${mock_total}% is below ${MOCK_COVERAGE_FLOOR}%" >&2
            failed=1
          fi
          exit "$failed"

  keyring-test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum
      - name: Build and vet keyring backend
        run: |
          go build -tags keyring ./...
          go vet -tags keyring ./...
      # go-keyring talks to the Secret Service over D-Bus on Linux, so the
      # round-trip test needs a session bus with an unlocked gnome-keyring.
      # The keyring-tagged Linux binary ships in the DEB/RPM packages and the
      # container image, so this variant must be exercised here too.
      - name: Install Linux Secret Service backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-keyring dbus-x11
      - name: Test keyring backend (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            printf "" | gnome-keyring-daemon --unlock --components=secrets
            go test -tags keyring ./...
          '
      - name: Test keyring backend
        if: runner.os != 'Linux'
        run: go test -tags keyring ./...

  lint:
    name: Lint ${{ matrix.variant }} build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            args: ""
          - variant: keyring
            args: --build-tags=keyring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: ${{ matrix.args }}

  security:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            tools/mock-fv-ssh-server/go.sum
      - name: Check module files are tidy
        run: |
          go mod tidy -diff
          (cd tools/mock-fv-ssh-server && go mod tidy -diff)
      - name: Lint Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Scan all build variants
        run: |
          govulncheck ./...
          govulncheck -tags keyring ./...
          (cd tools/mock-fv-ssh-server && govulncheck ./...)

  packages:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.0
          install-only: true
      - name: Validate and build package snapshot
        run: |
          goreleaser check
          goreleaser release --snapshot --clean --skip=publish,sign,sbom
      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm
      - name: Verify DEB and RPM packages
        run: |
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*.rpm' | wc -l)" -eq 2

          dpkg-deb --info dist/*_linux_amd64.deb
          dpkg-deb --contents dist/*_linux_arm64.deb
          sudo dpkg --install dist/*_linux_amd64.deb
          /usr/bin/fv-ssh-unlock --version
          /usr/bin/fv-ssh-unlock credentials providers --json
          dpkg --listfiles fv-ssh-unlock

          # The packaged unit must point at the packaged binary path, not the
          # /usr/local/bin path the tracked source unit uses.
          test -f /usr/lib/systemd/system/fv-ssh-unlock.service
          grep -q '^ExecStart=/usr/bin/fv-ssh-unlock ' \
            /usr/lib/systemd/system/fv-ssh-unlock.service
          systemd-analyze verify /usr/lib/systemd/system/fv-ssh-unlock.service

          sudo dpkg --remove fv-ssh-unlock

          rpm --query --package --info dist/*_linux_amd64.rpm
          rpm --query --package --list dist/*_linux_amd64.rpm
          rpm --query --package --info dist/*_linux_arm64.rpm
          rpm --query --package --list dist/*_linux_arm64.rpm
