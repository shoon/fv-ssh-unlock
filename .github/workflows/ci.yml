name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            tools/mock-fv-ssh-server/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Verify mock module
        working-directory: tools/mock-fv-ssh-server
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -cover ./...
      - name: Mock server build, vet, and test
        working-directory: tools/mock-fv-ssh-server
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

  keyring-test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum
      - name: Build and test keyring backend
        run: |
          go build -tags keyring ./...
          go vet -tags keyring ./...
          go test -tags keyring ./...

  security:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            tools/mock-fv-ssh-server/go.sum
      - name: Check module files are tidy
        run: |
          go mod tidy -diff
          (cd tools/mock-fv-ssh-server && go mod tidy -diff)
      - name: Lint Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Scan all build variants
        run: |
          govulncheck ./...
          govulncheck -tags keyring ./...
          (cd tools/mock-fv-ssh-server && govulncheck ./...)
