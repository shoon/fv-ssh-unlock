name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            tools/mock-fv-ssh-server/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Verify mock module
        working-directory: tools/mock-fv-ssh-server
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -cover ./...
      - name: Mock server build, vet, and test
        working-directory: tools/mock-fv-ssh-server
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

  keyring-test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum
      - name: Build and test keyring backend
        run: |
          go build -tags keyring ./...
          go vet -tags keyring ./...
          go test -tags keyring ./...

  security:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            tools/mock-fv-ssh-server/go.sum
      - name: Check module files are tidy
        run: |
          go mod tidy -diff
          (cd tools/mock-fv-ssh-server && go mod tidy -diff)
      - name: Lint Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Scan all build variants
        run: |
          govulncheck ./...
          govulncheck -tags keyring ./...
          (cd tools/mock-fv-ssh-server && govulncheck ./...)

  packages:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.0
          install-only: true
      - name: Validate and build package snapshot
        run: |
          goreleaser check
          goreleaser release --snapshot --clean --skip=publish,sign,sbom
      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm
      - name: Verify DEB and RPM packages
        run: |
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*.rpm' | wc -l)" -eq 2

          dpkg-deb --info dist/*_linux_amd64.deb
          dpkg-deb --contents dist/*_linux_arm64.deb
          sudo dpkg --install dist/*_linux_amd64.deb
          /usr/bin/fv-ssh-unlock --version
          /usr/bin/fv-ssh-unlock credentials providers --json
          dpkg --listfiles fv-ssh-unlock
          sudo dpkg --remove fv-ssh-unlock

          rpm --query --package --info dist/*_linux_amd64.rpm
          rpm --query --package --list dist/*_linux_amd64.rpm
          rpm --query --package --info dist/*_linux_arm64.rpm
          rpm --query --package --list dist/*_linux_arm64.rpm
