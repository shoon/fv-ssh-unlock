# SPDX-License-Identifier: Apache-2.0
name: Verify rc.4 release artifacts
on:
  push:
    branches: [maintenance/verify-rc4-artifacts]
    paths: [.github/workflows/verify-rc4-artifacts.yml]
permissions:
  contents: read
jobs:
  verify-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9428a2c332b887c23cdd9038a3f2e7a8ffc81a65
          fetch-depth: 0
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2
      - name: Verify source binding and download complete release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, re, subprocess, tarfile, time
          import urllib.error, urllib.request
          repo = 'shoon/fv-ssh-unlock'
          tag = 'v0.2.0-rc.4'
          sha = '9428a2c332b887c23cdd9038a3f2e7a8ffc81a65'
          version = tag[1:]
          root = 'https://api.github.com/repos/' + repo
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-rc4'
          folder.mkdir()
          def read(url, limit=100_000_000):
              request = urllib.request.Request(url, headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'fv-ssh-unlock-release-verification'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise RuntimeError('Download exceeds verification size bound')
              return data
          def api(path):
              return json.loads(read(root + path, 5_000_000))
          def check_tag():
              ref = api('/git/ref/tags/' + tag)['object']
              if ref['type'] != 'commit' or ref['sha'] != sha:
                  raise RuntimeError('Release tag no longer identifies the approved commit')
          if os.environ['GITHUB_REPOSITORY'] != repo:
              raise RuntimeError('Unexpected repository')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != sha:
              raise RuntimeError('Checkout does not match approved source')
          check_tag()
          source_url = 'https://github.com/' + repo + '/archive/refs/tags/' + tag + '.tar.gz'
          source = read(source_url)
          source_hash = hashlib.sha256(source).hexdigest()
          entries = subprocess.check_output(['git', 'ls-tree', '-r', '-z', '--full-tree', sha]).split(b'\0')
          expected = {}
          for entry in entries:
              if not entry:
                  continue
              metadata, path = entry.split(b'\t', 1)
              mode, kind, digest = metadata.decode().split()
              if kind != 'blob':
                  raise RuntimeError('Unsupported source tree entry')
              expected[path.decode()] = (mode, digest)
          actual = {}
          with tarfile.open(fileobj=io.BytesIO(source), mode='r:gz') as archive:
              for item in archive:
                  if item.isdir():
                      continue
                  pieces = item.name.split('/', 1)
                  if len(pieces) != 2 or pieces[1] not in expected or pieces[1] in actual:
                      raise RuntimeError('Unexpected or duplicate source archive path')
                  path = pieces[1]
                  mode, digest = expected[path]
                  if mode == '120000' and item.issym():
                      data = item.linkname.encode()
                  elif mode in ('100644', '100755') and item.isfile() and item.size <= 20_000_000:
                      data = archive.extractfile(item).read()
                  else:
                      raise RuntimeError('Unexpected archive member type')
                  blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  if blob != digest:
                      raise RuntimeError('Source archive differs from approved Git tree: ' + path)
                  actual[path] = blob
          if set(actual) != set(expected):
              raise RuntimeError('Source archive is missing tracked files')
          print('SOURCE_SHA256 ' + source_hash, flush=True)
          archives = [f'fv-ssh-unlock_{version}_{system}_{arch}.' + ('zip' if system == 'windows' else 'tar.gz')
                      for system in ('linux', 'darwin', 'windows') for arch in ('amd64', 'arm64')]
          packages = [f'fv-ssh-unlock_{version}_linux_{arch}.{ext}' for arch in ('amd64', 'arm64') for ext in ('deb', 'rpm')]
          payloads = archives + packages
          names = set(payloads + [name + '.sbom.json' for name in payloads] + ['checksums.txt', 'checksums.txt.sigstore.json'])
          release = None
          for attempt in range(40):
              try:
                  candidate = api('/releases/tags/' + tag)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              else:
                  assets = {asset['name']: asset for asset in candidate['assets']}
                  if not candidate['draft'] and names <= assets.keys() and all(assets[name]['state'] == 'uploaded' for name in names):
                      release = candidate
                      break
              time.sleep(15)
          if release is None or release['tag_name'] != tag or not release['prerelease']:
              raise RuntimeError('Complete expected prerelease is not available')
          base = 'https://github.com/' + repo + '/releases/download/' + tag + '/'
          hashes = {}
          for name in sorted(names):
              asset = assets[name]
              if asset['browser_download_url'] != base + name:
                  raise RuntimeError('Unexpected asset location')
              data = read(base + name)
              digest = hashlib.sha256(data).hexdigest()
              if asset.get('digest') != 'sha256:' + digest or len(data) != asset['size']:
                  raise RuntimeError('Downloaded asset differs from GitHub asset metadata: ' + name)
              (folder / name).write_bytes(data)
              hashes[name] = digest
          manifest = {}
          for line in (folder / 'checksums.txt').read_text().splitlines():
              match = re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9._-]+)', line)
              if not match or match[2] in manifest:
                  raise RuntimeError('Invalid or duplicate checksum entry')
              manifest[match[2]] = match[1]
          signed_names = names - {'checksums.txt', 'checksums.txt.sigstore.json'}
          if set(manifest) != signed_names or any(manifest[name] != hashes[name] for name in signed_names):
              raise RuntimeError('Published checksum manifest does not match downloaded artifacts')
          check_tag()
          report = {'tag': tag, 'commit': sha, 'source_url': source_url, 'source_sha256': source_hash,
                    'release_id': release['id'], 'release_assets': hashes, 'source_files_verified': len(actual)}
          (folder / 'verification.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Verify checksum signature and exact release workflow identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/verified-rc4"
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity 'https://github.com/shoon/fv-ssh-unlock/.github/workflows/release.yml@refs/tags/v0.2.0-rc.4' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            checksums.txt
          echo 'VERIFIED_RELEASE_REPORT_BEGIN'
          cat verification.json
          echo 'VERIFIED_RELEASE_REPORT_END'
          cat verification.json >> "$GITHUB_STEP_SUMMARY"
