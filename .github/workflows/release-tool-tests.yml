name: Release tooling tests
on:
  push:
    branches: [main]
    paths: ['.github/actions/**', '.github/workflows/release-*.yml', '.github/workflows/prepare-release.yml', '.github/dependabot.yml']
  pull_request:
    branches: [main]
    paths: ['.github/actions/**', '.github/workflows/release-*.yml', '.github/workflows/prepare-release.yml', '.github/dependabot.yml']
permissions:
  contents: read
  actions: read
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release and package safety invariants
        run: python3 -m unittest discover -s .github/actions/release-tools -p 'test_*.py' -v
  existing-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read-only regression test against the immutable rc.4 release
        uses: ./.github/actions/release-tools
        with:
          operation: verify
          tag: v0.2.0-rc.4
          expected-sha: 9428a2c332b887c23cdd9038a3f2e7a8ffc81a65
