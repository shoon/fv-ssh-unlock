# SPDX-License-Identifier: Apache-2.0

name: Container

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.txt
      - cmd/**
      - internal/**
      - pkg/**
      - deploy/**
      - hack/verify-container-image.sh
      - .github/workflows/container.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.txt
      - cmd/**
      - internal/**
      - pkg/**
      - deploy/**
      - hack/verify-container-image.sh
      - .github/workflows/container.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to the private Docker Hub repository
        type: boolean
        required: true
        default: false
      tag:
        description: Explicit prerelease tag (never latest)
        type: string
        required: true
        default: edge

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build local validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: fv-ssh-unlock:test
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          provenance: false
          sbom: false
      - name: Verify minimal and hardened runtime contract
        run: ./hack/verify-container-image.sh fv-ssh-unlock:test
      - name: Cross-build OCI image for both release platforms
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/fv-ssh-unlock.oci.tar
          tags: fv-ssh-unlock:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate requested prerelease tag
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$IMAGE_TAG" == "latest" || ! "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Refusing invalid or mutable image tag: $IMAGE_TAG" >&2
            exit 1
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: shoonimages/fv-ssh-unlock
          tags: type=raw,value=${{ inputs.tag }}
      - id: build
        name: Build and push signed-attestation candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.tag }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "shoonimages/fv-ssh-unlock@${DIGEST}"
