# SPDX-License-Identifier: Apache-2.0

name: Container

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.txt
      - cmd/**
      - internal/**
      - pkg/**
      - deploy/**
      - hack/verify-container-image.sh
      - hack/tagged_release.py
      - hack/test_tagged_release.py
      - .github/workflows/container.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.txt
      - cmd/**
      - internal/**
      - pkg/**
      - deploy/**
      - hack/verify-container-image.sh
      - hack/tagged_release.py
      - hack/test_tagged_release.py
      - .github/workflows/container.yml
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full commit SHA; required when publishing an existing version tag'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind release image to the exact version tag and main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 hack/tagged_release.py bind
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build local validation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: fv-ssh-unlock:test
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          provenance: false
          sbom: false
      - name: Verify minimal and hardened runtime contract
        run: ./hack/verify-container-image.sh fv-ssh-unlock:test
      - name: Cross-build OCI image for both release platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/fv-ssh-unlock.oci.tar
          tags: fv-ssh-unlock:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

  publish:
    if: >-
      github.repository == 'shoon/fv-ssh-unlock' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Bind the image version to the exact tag and main
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          python3 hack/tagged_release.py bind
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Require Docker Hub publisher credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are required" >&2
            exit 1
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: shoonimages/fv-ssh-unlock
          tags: type=raw,value=${{ steps.release.outputs.tag }}
      - id: build
        name: Build and push public release image with attestations
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release.outputs.tag }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.release.outputs.created }}
          provenance: mode=max
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "shoonimages/fv-ssh-unlock@${DIGEST}"
      - name: Verify the published signature and workflow identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for attempt in {1..12}; do
            if cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "shoonimages/fv-ssh-unlock@${DIGEST}"; then
              exit 0
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "signature was not discoverable after ${attempt} attempts" >&2
              exit 1
            fi
            echo "signature is not discoverable yet; retrying in 5 seconds" >&2
            sleep 5
          done
      - name: Verify public anonymous access and release platforms
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          anonymous_token="$(curl --fail --silent --show-error --location \
            'https://auth.docker.io/token?service=registry.docker.io&scope=repository:shoonimages/fv-ssh-unlock:pull' | \
            jq --exit-status --raw-output .token)"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${anonymous_token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://registry-1.docker.io/v2/shoonimages/fv-ssh-unlock/manifests/${DIGEST}" | \
            jq --exit-status '
              ([.manifests[]
                | select(.platform.os == "linux")
                | .platform.architecture] | sort) == ["amd64", "arm64"]
              and
              ([.manifests[]
                | select(.annotations["vnd.docker.reference.type"]
                  == "attestation-manifest")] | length) == 2
            '
      - name: Report immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "### Published container"
            echo
            echo "- Tag: \`shoonimages/fv-ssh-unlock:${IMAGE_TAG}\`"
            echo "- Digest: \`shoonimages/fv-ssh-unlock@${DIGEST}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Published container::shoonimages/fv-ssh-unlock@${DIGEST}"
