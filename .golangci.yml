# golangci-lint v2 configuration.
#
# `default: standard` enables errcheck, govet, ineffassign, staticcheck and
# unused — the same set the previous v1 config listed explicitly — and the
# `enable` block adds the extras on top.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - misspell
    # Security-focused static analysis. This project handles credentials,
    # host-key trust and file permissions, so gosec's rule set is squarely
    # on-topic rather than incidental.
    - gosec
    # Flags errors compared with == or type-asserted instead of errors.Is /
    # errors.As, and %v-formatted errors that should be %w. The credential
    # paths classify failures by error identity, so unwrapped comparisons
    # are a correctness risk here, not a style nit.
    - errorlint
  exclusions:
    generated: lax
    rules:
      # These Cobra writes are deliberately best-effort terminal output. Keep
      # the exception tied to the command output accessor so a future write to
      # a file or socket in the same source file is still checked.
      - path: ^cmd/fv-ssh-unlock/(automation|control_commands|main)\.go$
        source: 'fmt\.Fprint(f|ln)?\(cmd\.OutOrStdout\(\)'
        linters:
          - errcheck
      # unlockDevice's out parameter is the Cobra command's terminal writer.
      # Pairing the file and destination name leaves every other writer under
      # errcheck rather than exempting fmt.Fprintf process-wide.
      - path: ^cmd/fv-ssh-unlock/main\.go$
        source: 'fmt\.Fprintf\(out,'
        linters:
          - errcheck
      # Every output/tw write in the TUI targets its interactive terminal. A
      # failed redraw cannot be recovered after the terminal has gone away;
      # other destination names in the same file remain checked.
      - path: ^cmd/fv-ssh-unlock/tui\.go$
        source: 'fmt\.Fprint(f|ln)?\((output|tw),'
        linters:
          - errcheck
      # Test response bodies and environment cleanup are fixture setup, not
      # shipped I/O paths. Keep each exception local to the existing fixture.
      - path: ^internal/control/socket_test\.go$
        source: 'fmt\.Fprint\(w, `\{'
        linters:
          - errcheck
      - path: ^internal/credentials/credentials_test\.go$
        source: 'os\.(Setenv|Unsetenv)\('
        linters:
          - errcheck
      # Test files legitimately use fixed test credentials, permissive temp
      # dir modes and math/rand; gosec flags all three.
      - path: _test\.go$
        linters:
          - gosec

formatters:
  enable:
    - gofmt
